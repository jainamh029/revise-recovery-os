# Render blueprint: FastAPI + managed PostgreSQL. Deploy the Next.js app on Vercel (see README).
services:
  - type: web
    name: recovery-os-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: recovery-os-db, property: connectionString }
      - key: CORS_ORIGINS
        value: https://YOUR-VERCEL-APP.vercel.app
      - key: DEMO_TODAY
        value: ""
databases:
  - name: recovery-os-db
    plan: free
