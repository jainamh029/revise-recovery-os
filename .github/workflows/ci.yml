# STATUS: PREPARED, NOT YET EXECUTED REMOTELY. This repository has not been pushed to GitHub, so none of these jobs has run on a
# GitHub-hosted runner. Every command below was run locally (see RELEASE_EVIDENCE.md) except the GitHub-specific parts:
#   - the `services: postgres` container and its health check,
#   - `actions/*` setup steps and caching,
#   - `npx playwright install --with-deps chromium` on ubuntu-latest (the standard documented Playwright approach).
# Review the first remote run before trusting any of it.
name: ci
on:
  push:
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && ruff check app tests
      - run: cd backend && python -m pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: recovery_os }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recovery_os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Create the test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database recovery_os_test"
      - name: Migrations apply and match the models
        run: cd backend && alembic upgrade head && alembic check
      - name: Backend tests on PostgreSQL
        run: cd backend && python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/recovery_os_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - name: Type-check (the frontend's static check)
        run: cd frontend && npx tsc --noEmit
      - name: Unit tests
        run: cd frontend && npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - name: Production build
        run: cd frontend && npx next build

  e2e-chromium:
    # Same script as `make e2e`: starts its own API on a temporary SQLite file, runs the suite, cleans up.
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: scripts/e2e.sh sqlite
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: frontend/test-results, if-no-files-found: ignore }
