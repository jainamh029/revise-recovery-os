# Deploys the STATIC interactive demo to GitHub Pages: the real FastAPI backend runs in the visitor's browser (Pyodide / WebAssembly)
# on a pre-seeded SYNTHETIC database. Site URL: https://<owner>.github.io/<repo>/
# One-time repo setting: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions" (the workflow does not need secrets).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - run: cd frontend && npm ci
      - name: Build the static demo (seeds the synthetic database, bundles the backend, exports the frontend)
        run: PAGES_BASE_PATH="/${{ github.event.repository.name }}" scripts/build_pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/out }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
